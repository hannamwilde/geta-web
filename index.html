<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Geta Digital — E-handel som håller.</title>
  <meta name="description" content="Geta Digital är en nordisk e-handelskonsult. Strategi, design, PIM, integrationer och kontinuerlig utveckling — byggt för att skala, sedan 2010." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />

  <!-- CSS is loaded via the bootstrap below (auth token issue with relative paths). -->
  <style id="boot-css"></style>
</head>
<body style="font-family: Montserrat">
  <div id="root">
    <div id="boot-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:system-ui,sans-serif;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
        <svg viewBox="0 0 110 36" width="78" height="26" aria-hidden>
          <g fill="#FFFFFF">
            <path d="M14.4 7.6c4.3 0 7.6 1.5 9.9 4l-4 4.5c-1.5-1.6-3.3-2.4-5.7-2.4-4 0-6.7 2.9-6.7 7.3 0 4.5 2.7 7.4 6.9 7.4 1.8 0 3.3-.4 4.6-1.2v-3.4h-5.5l1.8-5.5h10.1V31c-2.8 2.3-6.6 3.6-11 3.6C6.5 34.6.4 28.8.4 21S6.4 7.6 14.4 7.6z"/>
            <path d="M40 13.5c6.3 0 10.5 4.4 10.5 10.5 0 .6-.1 1.5-.2 2.1H35.2c.6 2.6 2.5 3.9 5.1 3.9 1.9 0 3.6-.8 4.7-2.2l4.4 3.3c-2 2.6-5.1 4.1-9.2 4.1-6.7 0-11.2-4.5-11.2-10.8 0-6.4 4.5-10.9 11-10.9zm-4.9 8.5h9.8c-.4-2.3-2.2-3.6-4.8-3.6-2.7 0-4.4 1.4-5 3.6z"/>
            <path d="M53.4 11l6.4-2.8v6.1h6.1l-1.7 5.7h-4.4v8c0 1.7.7 2.6 2.4 2.6h3v5.6h-4.5c-4.7 0-7.3-2.4-7.3-7.1V11z"/>
            <path d="M84 14h6.5v20H84v-1.9c-1.4 1.6-3.5 2.5-6.1 2.5-5.5 0-9.5-4.5-9.5-10.8 0-6.4 4-10.9 9.5-10.9 2.5 0 4.7.9 6.1 2.4V14zm-9 9.7c0 3 2.1 5 5 5 2.9 0 5-2 5-5 0-3.1-2.1-5.1-5-5.1-2.9 0-5 2-5 5.1z"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- React + Babel pinned -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Bootstrap: the preview serves relative assets behind an auth token (?t=...).
       Script tags with bare src don't inherit it, so we fetch each JSX file with
       the token and feed it to Babel as inline text in order. -->
  <script>
  (async () => {
    const token = new URL(location.href).searchParams.get('t');
    const tokenQ = token ? ('?t=' + token) : '';

    // CSS first
    const cssFiles = [
      'styles.css',
      'components/nav/nav.css',
      'components/hero/hero.css',
      'components/trust/trust.css',
      'components/mozaik/mozaik.css',
      'components/services/services.css',
      'components/kundcase/kundcase.css',
      'components/contact-banner/contact-banner.css',
      'components/case/case.css',
      'components/pim/pim.css',
      'components/news/news.css',
      'components/team/team.css',
      'components/newsletter/newsletter.css',
      'components/footer/footer.css',
      'components/modals/modals.css',
      'components/text-block/text-block.css',
      'components/list-block/list-block.css',
      'components/banner-block/banner-block.css',
      'components/link-block/link-block.css',
      'components/quote-block/quote-block.css',
      'components/page-sections/page-sections.css',
      'components/mozaik-hero/mozaik-hero.css',
      'components/bullet-list-block/bullet-list-block.css',
      'components/grid-list/grid-list.css',
    ];
    const cssParts = await Promise.all(cssFiles.map(async f => {
      try { const r = await fetch(f + tokenQ); return r.ok ? await r.text() : ''; }
      catch { return ''; }
    }));
    document.getElementById('boot-css').textContent = cssParts.join('\n');

    // image-slot.js is a plain web component (not JSX) — load + run as a
    // regular script (fetch+inline so the auth token is honoured).
    try {
      const r = await fetch('image-slot.js' + tokenQ);
      if (r.ok) {
        const sc = document.createElement('script');
        sc.textContent = await r.text();
        document.body.appendChild(sc);
      }
    } catch (e) { /* slot becomes a no-op element */ }

    try {
      const r = await fetch('sanity-client.js' + tokenQ);
      if (r.ok) {
        const sc = document.createElement('script');
        sc.textContent = await r.text();
        document.body.appendChild(sc);
      }
    } catch (e) { /* sanity unavailable — components fall back to hardcoded data */ }

    const files = [
      'tweaks-panel.jsx',
      'components/icons/icons.jsx',
      'components/nav/nav.jsx',
      'components/hero/hero.jsx',
      'components/mozaik/mozaik.jsx',
      'components/services/services.jsx',
      'components/kundcase/kundcase.jsx',
      'components/contact-banner/contact-banner.jsx',
      'components/trust/trust.jsx',
      'components/case/case.jsx',
      'components/pim/pim.jsx',
      'components/news/news.jsx',
      'components/team/team.jsx',
      'components/newsletter/newsletter.jsx',
      'components/footer/footer.jsx',
      'components/modals/modals.jsx',
      'components/text-block/text-block.jsx',
      'components/list-block/list-block.jsx',
      'components/banner-block/banner-block.jsx',
      'components/link-block/link-block.jsx',
      'components/quote-block/quote-block.jsx',
      'components/mozaik-hero/mozaik-hero.jsx',
      'components/bullet-list-block/bullet-list-block.jsx',
      'components/grid-list/grid-list.jsx',
      'components/page-sections/page-sections.jsx',
      'app.jsx',
    ];
    // Use real `src` (with token) so the direct-edit tool can trace each
    // rendered element back to its source file. Babel fetches src-based
    // text/babel scripts itself and preserves document order on execution.
    for (const f of files) {
      const s = document.createElement('script');
      s.type = 'text/babel';
      s.setAttribute('data-presets', 'react');
      s.setAttribute('data-source', f);
      s.src = f + tokenQ;
      document.body.appendChild(s);
    }
    // Babel doesn't auto-process scripts appended after initial load — kick it.
    if (window.Babel && Babel.transformScriptTags) Babel.transformScriptTags();
  })();
  </script>
</body>
</html>
